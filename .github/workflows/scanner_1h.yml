name: Bitget 1H DL Scanner

on:
  repository_dispatch:
    types: [run-scanner-1h]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bitget-scanner-1h
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 1H Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main_1h.py
      - name: Save 1H signals log
        run: |
          if [ -f signals_log_1h.csv ] && [ -n "$(git status --porcelain signals_log_1h.csv)" ]; then
            git config user.name "scanner-bot-1h"
            git config user.email "scanner-bot@users.noreply.github.com"
            git add signals_log_1h.csv
            git commit -m "Update signals_log_1h.csv [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
